name: Crea APK HealthFit

on:
  workflow_dispatch:
  push:
    paths:
      - "healthfit-android.zip"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  apk:
    # sistema fisso: non cambia quando GitHub aggiorna "ubuntu-latest"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - name: Estrai il progetto Android
        working-directory: .
        run: unzip -o healthfit-android.zip

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Installa Capacitor
        run: npm install --no-audit --no-fund

      - name: Crea il progetto Android
        run: |
          rm -rf android
          npx cap add android
          python3 scripts/patch_android.py ${{ github.run_number }}
          npx cap sync android

      - name: Compila l'APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/HealthFit.apk

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Compila l'app per l'orologio
        working-directory: app/wear
        run: |
          gradle assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../android/app/build/outputs/apk/release/HealthFit-orologio.apk

      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ github.run_number }}
          name: HealthFit per Android 1.${{ github.run_number }}
          body: "HealthFit.apk va sul telefono (sopra la versione precedente: i dati restano). HealthFit-orologio.apk va sul Galaxy Watch."
          files: |
            app/android/app/build/outputs/apk/release/HealthFit.apk
            app/android/app/build/outputs/apk/release/HealthFit-orologio.apk
          make_latest: true
