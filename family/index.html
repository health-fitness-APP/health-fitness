<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FamilyManager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EF;--surface:#FFFFFF;--surface2:#F5F8F7;--ink:#1B2A2F;--muted:#5A6A6F;--line:#D3DCD9;
  --accent:#0F5C63;--accent-ink:#FFFFFF;--accent-soft:#DCEBEA;
  --warn:#9A6414;--warn-soft:#F6EAD3;--bad:#A83434;--bad-soft:#F6DEDB;--good:#2D704A;--good-soft:#DCEEE2;
  --water:#2E6FB7;--gas:#C2621A;--power:#B08A00;--heat:#B23A5A;
  --head:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11181A;--surface:#192326;--surface2:#1F2B2E;--ink:#E5EDEB;--muted:#9AADB0;--line:#2E3C40;
    --accent:#62B5BA;--accent-ink:#0D1F21;--accent-soft:#1C383B;
    --warn:#E3AA4E;--warn-soft:#382D18;--bad:#E58080;--bad-soft:#3B2222;--good:#6DC18F;--good-soft:#1B3426;
    --water:#6FA8E8;--gas:#EB9150;--power:#E2C14A;--heat:#E57A97;
  }
}
:root[data-theme="dark"]{
  --bg:#11181A;--surface:#192326;--surface2:#1F2B2E;--ink:#E5EDEB;--muted:#9AADB0;--line:#2E3C40;
  --accent:#62B5BA;--accent-ink:#0D1F21;--accent-soft:#1C383B;
  --warn:#E3AA4E;--warn-soft:#382D18;--bad:#E58080;--bad-soft:#3B2222;--good:#6DC18F;--good-soft:#1B3426;
  --water:#6FA8E8;--gas:#EB9150;--power:#E2C14A;--heat:#E57A97;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:750;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:650}
h3{font-size:1.05rem;font-weight:650}
p{margin:.4rem 0}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* struttura */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;font-family:var(--head);font-size:1.25rem;font-weight:400;letter-spacing:-.025em;white-space:nowrap;color:var(--ink);text-decoration:none;line-height:1}
.brand b{font-weight:750}
.brand .mark{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.brand .mark i{width:7px;height:16px;border-radius:2px}
.topbar .spacer{flex:1}
.topbar select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:46vw}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer}
#menuBtn{display:none}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1240px;margin:0 auto}
#side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;max-height:calc(100dvh - 70px);overflow:auto;padding:16px 10px 24px}
.grp{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;cursor:pointer;font-family:var(--head);font-size:.97rem;font-weight:700;color:var(--ink);padding:12px 10px 5px;text-align:left;border-radius:8px}
.grp:hover{background:var(--surface2)}
.grp .chev,.areah .chev{margin-left:auto;color:var(--muted);font-size:.9rem;transition:transform .15s}
.grp[aria-expanded="false"] .chev,.areah[aria-expanded="false"] .chev{transform:rotate(-90deg)}
#side .items{padding-bottom:4px}
#side a{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 20px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.92rem}
#side a:hover{color:var(--ink)}
#side a:hover{background:var(--surface2)}
#side a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
#side a .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
#side a.on .dot{background:var(--accent)}
main{padding:20px 22px 60px;min-width:0}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:.875rem;margin-bottom:16px}
.pagehead{margin-bottom:18px}
.pagehead p{max-width:62ch}
.tabbar{display:none}
.scrim{display:none}

/* componenti */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel.flat{background:var(--surface2)}
.panel h2,.panel h3{margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.big{font-family:var(--head);font-size:1.7rem;font-weight:750;line-height:1.1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neu{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.875rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],select.f,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
label.f{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 3px}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:none}
summary{cursor:pointer;padding:11px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-weight:500}
details[open] summary::after{content:"–"}
details .body{padding:0 0 14px}
ol.steps{margin:6px 0 0;padding-left:1.3em}
ol.steps li{margin:4px 0}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:10px 0;color:var(--muted);font-size:.92rem}

/* casa: mazzetta colori */
.fan{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px}
.fan .sw{flex:0 0 112px;height:150px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;cursor:pointer;text-align:left;padding:0;background:var(--surface)}
.fan .sw .c{flex:1}
.fan .sw .t{padding:7px 9px;background:var(--surface);font-size:.78rem;line-height:1.3}
.fan .sw .t b{display:block;font-size:.85rem}
.roomcard{display:grid;grid-template-columns:14px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0}
.roomcard .band{display:flex;flex-direction:column}
.roomcard .band i{flex:1}
.roomcard .in{padding:12px 14px}
.swatch{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);flex:0 0 42px}

/* mappa */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:14px;align-items:start}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}
.plan svg{display:block;width:100%;min-width:420px;height:auto}
.plan .room rect{fill:var(--surface2);stroke:var(--muted);stroke-width:1.5}
.plan .room text{fill:var(--muted);font-size:13px;font-family:var(--body)}
.pin{cursor:pointer}
.pin circle{stroke:var(--surface);stroke-width:3}
.pin.sel circle{stroke:var(--ink)}
.t-acqua{--c:var(--water)}.t-gas{--c:var(--gas)}.t-elettricita{--c:var(--power)}.t-riscaldamento{--c:var(--heat)}
.pin circle{fill:var(--c)}
.legend{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.photo{border:1.5px dashed var(--line);border-radius:10px;height:120px;display:grid;place-items:center;color:var(--muted);font-size:.9rem;background:var(--surface2);text-align:center;padding:8px}

/* domotica + assistente */
.dev{display:flex;flex-direction:column;gap:8px}
.toggle{width:46px;height:26px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);position:relative;cursor:pointer;flex:0 0 46px}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{left:22px;background:var(--accent-ink)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding:4px 2px 10px}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:.95rem}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .tablewrap table{font-size:.82rem}.msg th,.msg td{padding:5px 8px}.msg.ai{max-width:100%}.msg p{margin:.25rem 0}.msg ul{margin:.3rem 0;padding-left:1.2em}.msg li{margin:2px 0}
.suggest button:disabled{opacity:.5;cursor:default}
.invsez{margin:20px 0 8px;font-size:1.25rem}.invsez .pill{font-family:var(--body)}
.invcompatta td .small,.invcompatta td br,.invcompatta td .pill.neu{display:none}.invcompatta td{padding-top:6px;padding-bottom:6px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.85rem;cursor:pointer}

/* ricerca */
#gsearch{flex:1;max-width:380px;min-width:0;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}

/* drive */
ul.tree,ul.tree ul{list-style:none;margin:0;padding-left:18px}
ul.tree{padding-left:0}
ul.tree li{position:relative;padding:2px 0 2px 20px;font-size:.93rem}
ul.tree li::before{content:"";position:absolute;left:0;top:8px;width:13px;height:10px;border-radius:2px 2px 3px 3px;background:var(--accent);opacity:.75}
.gsign{max-width:420px;margin:0 auto;border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--surface)}

/* famiglia */
.who{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;text-decoration:none;flex:0 0 34px;font-family:var(--head)}

/* calendario e spesa */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.75rem;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:flex;flex-direction:column;align-items:center;padding:5px 2px 4px;cursor:pointer;font-size:.88rem;color:var(--ink)}
.cal .day.out{visibility:hidden}
.cal .day.today{border-color:var(--accent);font-weight:700;color:var(--accent)}
.cal .day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal .dots{display:flex;gap:2px;margin-top:auto;flex-wrap:wrap;justify-content:center;min-height:6px}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.cal .day.sel .dots i{box-shadow:0 0 0 1px var(--accent-ink)}
.who-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;flex:0 0 10px}

/* barra personalizzabile */
.tabprev{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.tabprev span{flex:1;text-align:center;font-size:.72rem;padding:8px 2px;color:var(--muted);font-weight:600}
.tabprev span:first-child{color:var(--accent)}
.tabprev b{display:block;font-size:1.1rem;font-weight:400}

/* pannello impostazioni */
#drawer{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:86vw;z-index:50;background:var(--surface);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 24px)}
body.menu #drawer{transform:none;box-shadow:8px 0 24px rgba(0,0,0,.15)}
.dlink{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}
.dlink:hover{background:var(--surface2)}
.dlink .ic{flex:0 0 34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line)}
.dlink small{display:block;color:var(--muted);font-size:.8rem;font-weight:400;margin-top:1px}

/* moduli */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 10px}
.fgrid .full{grid-column:1/-1}
.btn.rm{border-color:var(--line);color:var(--muted);background:transparent}
.btn.rm.danger{border-color:var(--bad);color:var(--bad)}
#saveState{font-size:.78rem}

/* trascina i file */
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:2px dashed var(--line);border-radius:12px;padding:18px 12px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface2);margin-top:8px;transition:border-color .15s,background .15s}
.dropzone:hover{border-color:var(--accent)}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dropzone b{color:var(--ink)}
.dropzone .fz-name{color:var(--accent);font-weight:600;word-break:break-all}
input.fz{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
input.fz:focus-visible + *{outline:2px solid var(--accent)}

/* spesa abituale */
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.95rem;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.pchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pdel{border:0;background:var(--surface2);border-radius:50%;width:22px;height:22px;cursor:pointer;color:var(--bad);font-size:.75rem;padding:0}
.star{border:0;background:none;font-size:1.25rem;line-height:1;cursor:pointer;color:var(--muted);padding:6px;flex:0 0 auto}
.star.on{color:var(--warn)}

/* dispensa */
.dsp-mode .mode{padding:9px 20px;font-size:1rem}
.mode.on.m-agg{background:var(--accent);color:var(--accent-ink)}
.mode.on.m-togli{background:var(--bad);color:#fff}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex:0 0 auto}
.qty button{border:0;background:var(--surface2);width:36px;height:36px;cursor:pointer;font-size:1.15rem;color:var(--ink)}
.qty b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.qty input.qn{width:48px;height:36px;border:0;border-radius:0;padding:0 2px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface);-moz-appearance:textfield}
.qty input.qn::-webkit-outer-spin-button,.qty input.qn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dsp-card{margin-top:12px;border:2px solid var(--accent)}
.dsp-cod{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.dsp-toast{position:relative;margin:12px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good);box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:.92rem}
.dsp-toast.warn{border-left-color:var(--warn)}
.dsp-toast .grow{flex:1 1 200px;min-width:0}

.dsp-live{position:fixed;inset:0;z-index:95;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.dsp-live video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dsp-mirino{position:relative;width:min(80vw,420px);height:min(30vw,170px);border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.dsp-live-t{position:relative;color:#fff;font-weight:600;text-align:center;margin:0}
.dsp-live .btn{position:relative}

.panel-go{cursor:pointer;transition:border-color .15s}
.panel-go:hover{border-color:var(--accent)}
.panel-go:active{background:var(--surface2)}
@media (max-width:860px){.panel-go .panel-link{display:none}}

/* scorri a sinistra per eliminare */
.sw{position:relative;overflow:hidden;border-radius:10px}
.sw-in{position:relative;z-index:1;background:var(--surface);transition:transform .2s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.sw-del{position:absolute;top:0;right:0;bottom:0;width:96px;border:0;background:var(--bad);color:#fff;font-weight:700;cursor:pointer;font-size:.95rem}
.sw.open .sw-in{transform:translateX(-96px)}
.sw-del{visibility:hidden}.sw.open .sw-del,.sw.moving .sw-del{visibility:visible}

/* scontrini */
.scthumb{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface2);cursor:zoom-in;width:110px;height:140px;overflow:hidden}
.scthumb img{width:100%;height:100%;object-fit:cover;display:block}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}

/* cartelle documenti */
.crumbs{margin:-8px 0 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{color:var(--accent);text-decoration:none}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.folder{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.folder:hover{border-color:var(--accent)}
.folder b{display:block;line-height:1.25}
.folder .s{display:block;font-size:.8rem;color:var(--muted);margin-top:3px}
.fic{flex:0 0 42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);font-size:1.25rem}

.sorting .sortable-item:not(.dragging){opacity:.75}
.tabprev{touch-action:none}

/* tutte le sezioni */
.areas{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.area{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:14px}
.area h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.areah{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:2px 0;color:var(--ink);font-family:var(--head);font-size:1.15rem;font-weight:700;text-align:left}
.areah i{width:12px;height:12px;border-radius:3px;background:var(--c);flex:0 0 12px}
.areah[aria-expanded="true"]{margin-bottom:12px}
.area h3 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--surface2);border:1px solid transparent;text-decoration:none;color:var(--ink);min-width:0}
.tile:hover{border-color:var(--c)}
.tile .ic{flex:0 0 34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:1rem}
.tile b{display:block;font-size:.92rem;line-height:1.2}
.tile .s{display:block;font-size:.78rem;color:var(--muted);margin-top:3px;line-height:1.25}

/* modalità */
.modes{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin:0 0 16px;gap:2px}
.mode{border:0;background:transparent;border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
.mode.on{background:var(--ink);color:var(--bg)}
.mode.on.m-vacanza{background:var(--water);color:#fff}
.mode.on.m-emergenza{background:var(--bad);color:#fff}
.sos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sos a{display:block;border-radius:14px;padding:18px;text-decoration:none;color:#fff;font-family:var(--head);font-weight:700;font-size:1.25rem;line-height:1.2}
.sos small{display:block;font-family:var(--body);font-weight:500;font-size:.85rem;opacity:.95;margin-top:6px;line-height:1.35}

/* foto */
.photos video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:#000}
.ph .play{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);margin-right:6px;font-size:.7rem}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.album{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0;display:block;width:100%}
.album .cover{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;height:140px}
.album .cover i:first-child{grid-row:1/3}
.album .in{display:block;padding:10px 12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.photos .ph{aspect-ratio:1;border-radius:8px;display:flex;align-items:flex-end;padding:6px;font-size:.75rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);overflow:hidden}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}

/* guida */
.guide-ch{scroll-margin-top:80px}
.toc{columns:2 220px;font-size:.93rem;margin:0;padding-left:1.2em}
.toc li{margin:3px 0}

<script>
/* FamilyManager fuori da claude.ai: accesso con email e password e archivio comune su Supabase.
   Imita le funzioni "db" e "user" di claude.ai, così il resto dell'app resta identico. */
(function () {
  const CFG = window.FM_CONFIG || {};
  const sb = window.supabase && CFG.url && CFG.key ? window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
  window.FM_SB = sb;
  let session = null, readyRes;
  // link speciale per copiare i dati dell'app di claude.ai: #importa=<chiave> (la chiave non lascia mai il telefono)
  let IMPORTA = null;
  { const m = /^#importa=([A-Za-z0-9_-]+)$/.exec(location.hash); if (m) { IMPORTA = m[1]; history.replaceState(null, "", location.pathname + location.search + "#/home"); } }
  const ready = new Promise(r => { readyRes = r; });

  /* ---------- schermata di accesso ---------- */
  const css = `#fmLogin{position:fixed;inset:0;z-index:9999;background:var(--bg,#EDF1EF);display:flex;align-items:center;justify-content:center;padding:16px;font-family:var(--body,system-ui,sans-serif);color:var(--ink,#1B2A2F)}
#fmLogin .box{width:100%;max-width:380px;background:var(--surface,#fff);border:1px solid var(--line,#D3DCD9);border-radius:18px;padding:24px}
#fmLogin h1{font-family:var(--head,system-ui);font-size:26px;margin:0 0 4px}#fmLogin p{margin:0 0 16px;color:var(--muted,#5A6A6F);font-size:14px}
#fmLogin label{display:block;font-size:13px;margin:10px 0 4px;color:var(--muted,#5A6A6F)}
#fmLogin input{width:100%;box-sizing:border-box;font-size:16px;padding:12px;border:1px solid var(--line,#D3DCD9);border-radius:12px;background:var(--surface2,#F5F8F7);color:inherit}
#fmLogin button{width:100%;margin-top:16px;font-size:16px;padding:13px;border:0;border-radius:12px;background:var(--accent,#0F5C63);color:#fff;cursor:pointer}
#fmLogin .lnk{background:none;color:var(--accent,#0F5C63);margin-top:8px;padding:6px;font-size:14px}
#fmLogin .err{color:var(--bad,#A83434);font-size:14px;margin-top:10px;min-height:1em}`;
  function showLogin(msg) {
    if (!document.body) { document.addEventListener("DOMContentLoaded", () => showLogin(msg), { once: true }); return; }
    if (document.getElementById("fmLogin")) { setErr(msg || ""); return; }
    const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
    const d = document.createElement("div"); d.id = "fmLogin";
    d.innerHTML = `<form class="box" autocomplete="on"><h1>FamilyManager</h1><p>Entra con la tua email e la tua password.</p>
<label for="fmEm">Email</label><input id="fmEm" type="email" autocomplete="username" required>
<label for="fmPw">Password</label><input id="fmPw" type="password" autocomplete="current-password" required minlength="6">
<button type="submit" id="fmGo">Entra</button>
<button type="button" class="lnk" id="fmNew">Prima volta? Crea la tua password</button>
<button type="button" class="lnk" id="fmForgot">Password dimenticata</button>
<div class="err" id="fmErr"></div></form>`;
    document.body.appendChild(d);
    let nuovo = false;
    const f = d.querySelector("form"), em = d.querySelector("#fmEm"), pw = d.querySelector("#fmPw"), go = d.querySelector("#fmGo");
    d.querySelector("#fmNew").onclick = () => { nuovo = !nuovo; go.textContent = nuovo ? "Crea e entra" : "Entra"; d.querySelector("#fmNew").textContent = nuovo ? "Ho già la password" : "Prima volta? Crea la tua password"; setErr(""); };
    d.querySelector("#fmForgot").onclick = async () => {
      if (!em.value) { setErr("Scrivi prima la tua email."); return; }
      const { error } = await sb.auth.resetPasswordForEmail(em.value.trim(), { redirectTo: location.href.split("#")[0] });
      setErr(error ? "Non sono riuscito a mandare la mail." : "Ti ho mandato una mail per cambiare la password.");
    };
    f.onsubmit = async e => {
      e.preventDefault(); go.disabled = true; setErr("");
      const cred = { email: em.value.trim(), password: pw.value };
      const { data, error } = nuovo ? await sb.auth.signUp(Object.assign({ options: { emailRedirectTo: location.href.split("#")[0] } }, cred)) : await sb.auth.signInWithPassword(cred);
      go.disabled = false;
      if (error) { setErr(/invalid/i.test(error.message) ? "Email o password sbagliate." : /registered/i.test(error.message) ? "Questa email ha già una password: premi «Ho già la password»." : "Errore: " + error.message); return; }
      if (nuovo && !data.session) { setErr("Ti ho mandato una mail: apri il link per confermare, poi torna qui ed entra."); return; }
    };
  }
  function setErr(t) { const e = document.getElementById("fmErr"); if (e) e.textContent = t; }
  function hideLogin() { const d = document.getElementById("fmLogin"); if (d) d.remove(); }

  async function checkFamily() {
    const { data, error } = await sb.from("famiglia").select("email").limit(1);
    return !error && data && data.length > 0;
  }
  async function onSession(s) {
    if (!s) { session = null; showLogin(); return; }
    if (session && session.user.id === s.user.id) { session = s; return; }
    session = s;
    if (!(await checkFamily())) { showLogin("Questa email non è tra quelle della famiglia. Chiedi a Daniele di aggiungerla."); await sb.auth.signOut(); return; }
    if (IMPORTA) { try { await importa(IMPORTA); } catch (e) { alert("Copia dei dati non riuscita: " + (e && e.message || e)); } IMPORTA = null; }
    hideLogin(); readyRes(true);
  }
  async function importa(k) {
    const b64 = k.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((k.length + 3) % 4);
    const key = await crypto.subtle.importKey("raw", Uint8Array.from(atob(b64), c => c.charCodeAt(0)), "AES-GCM", false, ["decrypt"]);
    const r = await fetch("importa.bin", { cache: "no-store" }); if (!r.ok) throw new Error("file dei dati non trovato");
    const buf = new Uint8Array(await r.arrayBuffer());
    const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
    const txt = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    const rows = Object.entries(JSON.parse(txt)).map(([path, data]) => ({ path, data, updated_by: session.user.id }));
    for (let i = 0; i < rows.length; i += 5) {
      const { error } = await sb.from("docs").upsert(rows.slice(i, i + 5)); if (error) throw error;
    }
    alert("Fatto: ho copiato " + rows.length + " voci dall'app di claude.ai.");
  }
  if (sb) {
    sb.auth.getSession().then(({ data }) => onSession(data.session));
    sb.auth.onAuthStateChange((ev, s) => { if (ev === "SIGNED_OUT") { location.reload(); return; } if (s) onSession(s); });
  } else document.addEventListener("DOMContentLoaded", () => showLogin("App non ancora collegata all'archivio."));

  /* ---------- archivio: imita db di claude.ai ---------- */
  const cache = new Map();          // path -> data
  const subs = new Set();           // {col, cb}
  let channel = null, loaded = false;
  const colOf = p => { const i = p.lastIndexOf("/"); return i < 0 ? "" : p.slice(0, i); };
  const idOf = p => p.slice(p.lastIndexOf("/") + 1);
  function snapFor(col) {
    const docs = [];
    cache.forEach((v, p) => { if (colOf(p) === col) docs.push({ id: idOf(p), exists: true, data: () => v }); });
    return { docs, size: docs.length, empty: !docs.length };
  }
  function emit(col) { subs.forEach(s => { if (s.col === col) try { s.cb(snapFor(col)); } catch (e) { console.error(e); } }); }
  async function loadAll() {
    if (loaded) return; loaded = true;
    let from = 0;
    for (;;) {
      const { data, error } = await sb.from("docs").select("path,data").range(from, from + 499);
      if (error) { loaded = false; throw error; }
      data.forEach(r => cache.set(r.path, r.data));
      if (data.length < 500) break; from += 500;
    }
    channel = sb.channel("docs-live").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, pl => {
      const p = (pl.new && pl.new.path) || (pl.old && pl.old.path); if (!p) return;
      if (pl.eventType === "DELETE") cache.delete(p); else cache.set(p, pl.new.data);
      emit(colOf(p));
    }).subscribe(st => { if (st === "SUBSCRIBED" && loaded) { /* ricollegato: ricarica per non perdere modifiche */ refresh(); } });
  }
  let refreshing = false;
  async function refresh() {
    if (refreshing) return; refreshing = true;
    try {
      const fresh = new Map(); let from = 0;
      for (;;) { const { data, error } = await sb.from("docs").select("path,data").range(from, from + 499); if (error) return; data.forEach(r => fresh.set(r.path, r.data)); if (data.length < 500) break; from += 500; }
      const cols = new Set();
      cache.forEach((v, p) => { if (!fresh.has(p)) { cache.delete(p); cols.add(colOf(p)); } });
      fresh.forEach((v, p) => { if (JSON.stringify(cache.get(p)) !== JSON.stringify(v)) { cache.set(p, v); cols.add(colOf(p)); } });
      cols.forEach(emit);
    } finally { refreshing = false; }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && loaded) refresh(); });

  function doc(path) {
    return {
      id: idOf(path),
      async get() { await loadAll(); const v = cache.get(path); return { id: idOf(path), exists: v !== undefined, data: () => v }; },
      async set(data) {
        const { error } = await sb.from("docs").upsert({ path, data, updated_by: session.user.id, updated_at: new Date().toISOString() });
        if (error) throw Object.assign(new Error(error.message), { code: "write_failed" });
        cache.set(path, data); emit(colOf(path));
      },
      async update(patch) { await loadAll(); return this.set(Object.assign({}, cache.get(path) || {}, patch)); },
      async delete() {
        const { error } = await sb.from("docs").delete().eq("path", path);
        if (error) throw Object.assign(new Error(error.message), { code: "write_failed" });
        cache.delete(path); emit(colOf(path));
      }
    };
  }
  function collection(col) {
    return {
      doc: id => doc(col + "/" + id),
      onSnapshot(cb, onErr) {
        const s = { col, cb }; subs.add(s);
        loadAll().then(() => cb(snapFor(col))).catch(e => { if (onErr) onErr(e); });
        return () => subs.delete(s);
      },
      async get() { await loadAll(); return snapFor(col); }
    };
  }
  const DB = { doc, collection };
  const USER = {
    id: async () => session.user.id,
    me: async () => ({ id: session.user.id, name: "", email: session.user.email }),
    can: async () => true, isOwner: () => true, canEdit: () => true,
    profiles: async ids => Object.fromEntries((ids || []).map(i => [i, { id: i, name: "" }]))
  };

  window.FM_ESCI = () => sb && sb.auth.signOut();
  window.FM_APP = true;    // l'app sa di girare fuori da claude.ai
  window.claude = {
    use: async name => {
      if (!sb) return null;
      if (name === "db") { await ready; return DB; }
      if (name === "user") { await ready; return USER; }
      return null;   // Claude, connettori, voce: solo dentro claude.ai
    }
  };
})();

</script>

<script>
"use strict";
/* ---------- utilità ---------- */
const today = new Date(); today.setHours(0,0,0,0);
const addDays = n => { const d = new Date(today); d.setDate(d.getDate() + n); return d; };
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const daysTo = d => Math.round((d - today) / 864e5);
const eur = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const eur2 = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });

const fm = d => d.toLocaleDateString("it-IT", { month: "long", year: "numeric" });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);
const state = { salWho: "tutti", cal: { y: today.getFullYear(), m: today.getMonth(), sel: null }, calWho: "tutti", lista: "super", vadoIo: false, mode: "normale", casaVuota: false, check: {}, polCat: "Tutte", avvisi: [60, 30, 7], q: "", drive: { step: 0, email: "", made: 0, backup: true, shared: false, timer: null }, viewAs: "luca", fotoFilter: "Tutti", fotoUp: {}, casa: "tutte", roomFilter: "Tutti", pinFilter: "tutti", pin: null, garFilter: "tutte", speseTipo: "tutte", chat: [] };
const META = { started: false };
/* ---------- moduli e cestino ---------- */
const FORMS = {};
const onSave = (id, label, fn) => { FORMS[id] = Object.assign(FORMS[id] || {}, { save: fn, label }); };
function formHtml(id, title, fields, btn) {
  FORMS[id] = Object.assign(FORMS[id] || {}, { fields });
  const inp = f => {
    const a = `id="ff-${id}-${f.k}"`;
    if (f.t === "select") return `<select class="f" ${a}>${f.o.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(f.v) === String(v) ? "selected" : ""}>${esc(l)}</option>`; }).join("")}</select>`;
    if (f.t === "area") return `<textarea ${a} rows="${f.rows || 3}" placeholder="${esc(f.ph || "")}">${esc(f.v || "")}</textarea>`;
    if (f.t === "file") return `<input type="file" ${a} accept="${esc(f.accept || "")}">`;
    if (f.t === "check") return `<div><input type="checkbox" ${a} ${f.v ? "checked" : ""} style="width:20px;height:20px"></div>`;
    if (f.t === "color") return `<input type="color" ${a} value="${esc(f.v || "#d9d4c7")}" style="width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">`;
    const val = f.v instanceof Date ? iso(f.v) : (f.v == null ? "" : f.v);

  if (!MUTUO.attivo || !MUTUO.importo || !MUTUO.anni) return { vuoto: true, n: 0, rata: 0, paid: 0, residuo: 0, intPag: 0, intRes: 0, intTot: 0, quotaI: 0, quotaC: 0, fine: new Date(today), prossima: new Date(today.getFullYear(), today.getMonth() + 1, 1), mesiRes: 0 };
  const n = MUTUO.anni * 12, r = MUTUO.tasso / 100 / 12;
  const rata = MUTUO.importo * r / (1 - Math.pow(1 + r, -n));
  // rate già pagate a oggi: la rata del mese conta dal suo giorno di scadenza
  let paid = (today.getFullYear() - MUTUO.inizio.getFullYear()) * 12 + (today.getMonth() - MUTUO.inizio.getMonth()) + (today.getDate() >= MUTUO.inizio.getDate() ? 1 : 0);
  paid = Math.max(0, Math.min(n, paid));
  // piano di ammortamento: il debito scende a ogni rata, anche per le rate future
  let sim = MUTUO.importo, res = MUTUO.importo, intPag = 0, intTot = 0, quotaI = 0, quotaC = 0;
  for (let i = 1; i <= n; i++) {
    const int = sim * r, cap = rata - int;
    intTot += int; sim -= cap;
    if (i <= paid) { intPag += int; res = sim; }
    if (i === paid + 1) { quotaI = int; quotaC = cap; }
  }
  const fine = addMonths(MUTUO.inizio, n - 1);
  const prossima = paid < n ? addMonths(MUTUO.inizio, paid) : new Date(fine);
  return { n, rata, paid, residuo: Math.max(0, res), intPag, intRes: intTot - intPag, intTot, quotaI, quotaC, fine, prossima, mesiRes: n - paid };
}

// date di pagamento delle cedole: dal giorno e mese della scadenza, una o più volte l'anno
function cedoleDi(i) {
  if (!isBond(i) || !i.scad || !(i.freqN > 0)) return [];
  const step = 12 / i.freqN, out = [];
  for (let k = 0; k < i.freqN; k++) out.push({ m: (i.scad.getMonth() + k * step) % 12, g: i.scad.getDate() });
  return out.sort((a, b) => a.m - b.m);
}
function investCalc() {
  const cx = cambioUsd();
  return INVEST.map(i => {
    const fx = i.valuta === "USD" ? cx : 1, tassa = tassaDi(i), cap = +i.capitale || 0;
    const lordo = isBond(i) && i.nominale && i.cedola != null ? i.nominale * i.cedola / 100 / fx : i.annuoLordo != null ? i.annuoLordo : cap * (i.resa || 0) / 100;
    const valore = i.prezzo ? (isBond(i) ? (i.nominale || 0) * i.prezzo / 100 : (i.quote || 0) * i.prezzo) / fx : i.valoreAtt != null ? i.valoreAtt : null;
    const bollo = i.tipo !== "Affitto" && META.bollo !== false ? (valore != null ? valore : cap) * 0.002 : 0;
    const nettoTasse = lordo * (1 - tassa / 100), netto = nettoTasse - bollo;
    let ytm = null, anni = null;
    if (isBond(i) && i.scad && cap > 0 && i.nominale) {
      anni = Math.max(0.1, (i.scad - today) / 3.15576e10);
      const rimborso = i.nominale / fx, plus = rimborso - cap;
      ytm = (nettoTasse + (plus > 0 ? plus * (1 - tassa / 100) : plus) / anni) / cap * 100;
    }
    return Object.assign({}, i, { lordo, netto, nettoTasse, bollo, tassa, valore, gp: valore != null ? valore - cap : null, fx, ytm, anni, resaNetta: cap > 0 ? nettoTasse / cap * 100 : null });
  });
}
function incassiMese(list) {
  const M = Array.from({ length: 12 }, () => ({ tot: 0, items: [] }));
  list.forEach(i => cedoleDi(i).forEach(c => { const v = i.nettoTasse / i.freqN; M[c.m].tot += v; M[c.m].items.push({ i, g: c.g, v }); }));
  M.forEach(x => x.items.sort((a, b) => a.g - b.g));
  return M;
}

];

const extraMese = () => { const da = addMonths(today, -12); return SPESE.filter(s => s.tipo === "extra" && s.d >= da).reduce((a, s) => a + (+s.imp || 0), 0) / 12; };
const speseParMese = (conMutuo = true) => fisseMese(conMutuo) + (META.parExtra ? extraMese() : 0);
const entrateMese = () => investCalc().reduce((a, i) => a + i.netto, 0) / 12;
// entrate di oggi dagli investimenti, più i nuovi risparmi investiti al rendimento scelto
function pareggio(risparmio, resaNetta) {
  const base = entrateMese(), capitale0 = INVEST.reduce((a, i) => a + (+i.capitale || 0), 0);
  let nuovo = 0;
  const serie = [];
  for (let m = 0; m <= 480; m++) {
    const d = addMonths(today, m);
    const entrate = base + nuovo * resaNetta / 100 / 12;
    const spese = speseParMese(!MC.vuoto && d <= MC.fine);
    if (m % 6 === 0) serie.push({ m, entrate, spese });
    if (spese > 0 && entrate >= spese) { if (m % 6) serie.push({ m, entrate, spese }); return { mesi: m, data: d, serie, capitale: capitale0 + nuovo }; }
    nuovo += risparmio;
  }
  return { mesi: null, serie, capitale: capitale0 + nuovo };
}

function bindSwipe() {
  const W = 96;
  document.querySelectorAll("#view .sw").forEach(sw => {
    const inn = sw.querySelector(".sw-in"); if (!inn) return;
    let x0 = null, y0 = 0, dx = 0, mode = null, pid = null;
    inn.addEventListener("pointerdown", e => { if (e.button > 0) return; x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null; pid = e.pointerId; });
    inn.addEventListener("pointermove", e => {
      if (x0 === null || e.pointerId !== pid) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!mode) {
        if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) { mode = "h"; try { inn.setPointerCapture(pid); } catch (er) {} inn.style.transition = "none"; sw.classList.add("moving"); document.querySelectorAll("#view .sw.open").forEach(o => { if (o !== sw) o.classList.remove("open"); }); if (document.activeElement && inn.contains(document.activeElement)) document.activeElement.blur(); }
        else if (Math.abs(my) > 10) mode = "v";
      }
      if (mode === "h") { dx = Math.max(-W - 30, Math.min(0, (sw.classList.contains("open") ? -W : 0) + mx)); inn.style.transform = `translateX(${dx}px)`; e.preventDefault(); }
    });
    const fine = e => { if (e.pointerId !== pid) return; if (mode === "h") { inn.style.transition = ""; inn.style.transform = ""; setTimeout(() => sw.classList.remove("moving"), 250); sw.classList.toggle("open", dx < -W / 2); sw._mosso = true; setTimeout(() => { sw._mosso = false; }, 60); } x0 = null; pid = null; mode = null; };
    inn.addEventListener("pointerup", fine); inn.addEventListener("pointercancel", fine);
    inn.addEventListener("click", e => { if (sw._mosso || sw.classList.contains("open")) { e.stopPropagation(); e.preventDefault(); if (!sw._mosso) sw.classList.remove("open"); } }, true);
  });
}

  { t: "Calendario di famiglia", a: "Gli impegni di tutti in un calendario condiviso.", s: ["Apri Calendario: vedi il mese con un pallino colorato per ogni impegno, del colore della persona.", "Tocca un giorno per vedere i suoi impegni, oppure guarda l'elenco dei prossimi 30 giorni.", "Per aggiungere un impegno scrivi cosa, giorno e ora, scegli chi partecipa e se si ripete.", "Chi partecipa riceve il promemoria sul proprio telefono.", "Filtra per persona per vedere solo gli impegni di uno.", "Le scadenze di assicurazioni, garanzie, mutuo, bollette e viaggi compaiono da sole in grigio, solo a chi può vederle."], n: "Il collegamento automatico con Google Calendar non è ancora attivo: per ora ogni impegno ha il tasto + Google per copiarlo nel proprio Google Calendar." },

  { t: "Dispensa", a: "Cosa c'è in casa e quando scade, pezzo per pezzo, con i codici a barre.", s: ["Apri Famiglia, Dispensa.", "Quando metti via la spesa scegli ➕ Aggiungi e tocca 📷 Fotografa il codice: inquadra il codice a barre da vicino, dritto e con buona luce.", "La prima volta che fotografi un prodotto Claude prova a riconoscerlo dalla foto: controlla nome e reparto e correggili se serve. Dalla volta dopo l'app lo riconosce da sola.", "Scegli quanti pezzi e la scadenza. Con 📷 Leggi la data fotografi la data stampata sulla confezione e Claude la scrive per te. Poi tocca Metti in dispensa.", "Se fotografi di nuovo lo stesso codice mentre la scheda è aperta, i pezzi aumentano di uno.", "Quando usi o butti un prodotto scegli ➖ Togli e fotografa il codice: l'app toglie il pezzo che scade per primo. Se era l'ultimo, con un tocco lo metti nella lista della spesa.", "Nell'elenco i tasti − e + tolgono o aggiungono un pezzo senza fotografare; in Scadenza di ognuno cambi la data di un singolo pezzo.", "In alto vedi cosa va consumato entro 7 giorni e cosa è già scaduto: tocca Usato quando lo consumi.", "Con un lettore di codici a barre Bluetooth o USB basta toccare la casella dei numeri e passare i prodotti uno dopo l'altro."], n: "Se il codice non si legge puoi scrivere i numeri sotto le barre, oppure aggiungere il prodotto senza codice. L'assistente conosce la dispensa: puoi chiedergli cosa scade questa settimana." },

  { t: "Bonus edilizi", a: "Superbonus 110%, barriere architettoniche, ristrutturazione: una pratica per ogni bonus.", s: ["Crea la pratica: tipo di bonus, anno, importo dei lavori, come è stato usato.", "Carica fatture, bonifici, titoli edilizi, asseverazioni, ENEA, APE, visti di conformità.", "Controlla l'elenco dei documenti mancanti.", "Per la detrazione in dichiarazione, l'app mostra le rate usate e quelle da usare e ti avvisa prima della dichiarazione.", "In caso di controllo esporta tutta la pratica in un PDF ordinato."], n: "L'elenco dei documenti richiesti va confermato con il tecnico o il commercialista." },

  { t: "Bollette e spese", a: "Utenze, TARI, IMU, condominio, manutenzioni e spese extra per ogni immobile.", s: ["Fotografa la bolletta, carica il PDF o inoltra l'email del fornitore.", "L'app legge importo, scadenza, periodo e consumi.", "Assegna la spesa all'immobile o alla famiglia.", "Segna la bolletta come pagata, o lascia che l'app ti ricordi la scadenza.", "Guarda il grafico dei consumi per notare perdite e sprechi."] },
  { t: "Spese extra, scontrini e fatture", a: "Vacanze, salute, scuola, auto, regali e tutte le altre spese.", s: ["Carica foto o PDF, oppure scrivi o di' la spesa (es. 85 euro di pizzeria sabato).", "Controlla data, importo, fornitore e categoria proposti.", "Per un viaggio, raggruppa le spese sotto lo stesso nome per vedere il totale.", "Conferma: si aggiornano costi familiari e punto di pareggio.", "Se c'è una garanzia o la spesa è detraibile, l'app crea la scheda o la segna per la dichiarazione."] },
  { t: "Costi familiari", a: "Quanto costano casa e famiglia al mese e all'anno, mutuo compreso.", s: ["Apri Costi familiari per il totale del mese e il confronto con l'anno prima.", "Guarda la divisione per categoria e per immobile.", "Controlla le spese in arrivo nei prossimi 3 mesi.", "Imposta un budget per categoria e ricevi un avviso prima di superarlo.", "Esporta il riepilogo annuale in Excel o PDF."] },

  { t: "Investimenti", a: "Obbligazioni, ETF, azioni e fondi pensione di ogni conto: quanto avete messo, quanto vale oggi, quanto rende e quando paga.", s: ["In alto scegli Tutti i conti oppure un conto solo.", "Sopra le tabelle filtra i titoli per tipo, paese, valuta o cercali per nome e ISIN. Tocca il titolo di una tabella per ridurla o riaprirla; Righe compatte mostra meno dettagli per riga.", "Aggiungi ogni investimento con conto, ISIN, quanto hai pagato; per le obbligazioni anche valore nominale, cedola, cedole all'anno e scadenza: le date delle cedole si calcolano da sole.", "Per aggiornare i guadagni e le perdite scrivi nelle tabelle il valore di oggi che vedi in banca, oppure mandalo a Claude con uno screenshot.", "Per i titoli in dollari aggiorna ogni tanto il cambio nelle Impostazioni dei calcoli.", "Guarda il calendario degli incassi mese per mese e come sono distribuiti i soldi per tipo, paese, valuta e scadenza.", "In Andamento del patrimonio vedi quanto sale o scende il valore rispetto all'aggiornamento precedente: l'app segna un punto ogni giorno in cui i valori cambiano, senza contare i nuovi acquisti come guadagni.", "Leggi le osservazioni per decidere come continuare a investire e condividile con il consulente.", "In Chiedi a Claude fai domande sui vostri investimenti: Claude risponde usando i numeri della pagina e del punto di pareggio. La prima volta l'app chiede il permesso; la conversazione non viene salvata."], n: "Tasse: 12,5% sui titoli di Stato, 26% sugli altri. La rendita mostrata è già senza tasse e bollo dello 0,2%." },
  { t: "Punto di pareggio", a: "Quando le entrate degli investimenti coprono le spese fisse.", s: ["Apri Punto di pareggio per vedere la percentuale di copertura di oggi.", "Scrivi le spese fisse al mese: mutuo, bollette, costi della casa e del bungalow.", "Se vuoi, spunta Conta anche le spese extra: vacanze, regali e le altre spese extra entrano con la media degli ultimi 12 mesi.", "Imposta quanto risparmi e investi ogni mese.", "Imposta il rendimento netto atteso dei nuovi investimenti.", "Leggi la data stimata e guarda il grafico: la linea delle entrate incontra quella delle spese.", "Prova le simulazioni: estinzione del mutuo, affitto o vendita della seconda casa."], n: "Le stime dipendono da rendimenti futuri non garantiti." },

V.guida = () => head("Guida e istruzioni", "Come usare ogni sezione, da telefono e da PC.") + `
  <div class="row" style="margin-bottom:12px"><input type="text" id="gq" placeholder="Cerca nella guida: filtri, polizza, rubinetto..." style="max-width:420px"></div>
  <div class="panel" style="margin-bottom:14px"><h2>Capitoli</h2><ol class="toc">${GUIDA.map((c, i) => `<li><a href="#/guida" data-go="g${i}">${c.t}</a></li>`).join("")}<li><a href="#/guida" data-go="gidee">Da decidere</a></li></ol></div>
  <div id="gbody">${GUIDA.map((c, i) => `<div class="panel guide-ch" id="g${i}" style="margin-bottom:12px" data-txt="${esc((c.t + " " + c.a + " " + c.s.join(" ") + " " + (c.n || "")).toLowerCase())}"><h2>${i + 1}. ${c.t}</h2><p class="muted">${c.a}</p><ol class="steps">${c.s.map(x => `<li>${esc(x)}</li>`).join("")}</ol>${c.n ? `<p class="note">${esc(c.n)}</p>` : ""}</div>`).join("")}

function bindGuida() {
  document.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); const t = document.getElementById(a.dataset.go); if (t) t.scrollIntoView({ behavior: "smooth" }); });
  $("#gq").oninput = e => { const q = e.target.value.trim().toLowerCase(); let n = 0; document.querySelectorAll(".guide-ch").forEach(c => { const ok = !q || c.dataset.txt.includes(q); c.hidden = !ok; if (ok) n++; }); $("#gnone").hidden = n > 0; };
}

function exportPanel() { return `<div class="panel" style="margin-top:22px"><h2>Trasferisci i dati in un'altra copia dell'app</h2><p class="small">Serve per spostare FamilyManager su un altro account: prepari qui i dati, li copi, e nella nuova copia li incolli in <b>Importa i dati</b>.</p><div class="row" style="margin-top:10px"><button class="btn" id="expGo">Prepara i dati da copiare</button><button class="btn ghost" id="expCopy" hidden>Copia</button><span class="small muted" id="expMsg"></span></div><textarea id="expTxt" rows="4" readonly hidden style="margin-top:10px;font-family:monospace;font-size:.75rem"></textarea></div>`; }
function importPanel() { return `<div class="panel" style="margin-top:14px"><h2>Importa i dati</h2><p class="small">Incolla qui i dati copiati da un'altra copia di FamilyManager. Sostituiscono quelli presenti in questa copia, per tutti.</p><textarea id="impTxt" rows="4" placeholder="Incolla qui i dati" style="margin-top:8px;font-family:monospace;font-size:.75rem"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="impGo">Importa i dati</button><span class="small" id="impMsg"></span></div></div>`; }
function bindTransfer() {
  const eg = $("#expGo"); if (eg) eg.onclick = () => { const data = {}; STORE_KEYS().forEach(k => { data[k] = ser(storeGet(k)); }); const txt = JSON.stringify({ app: "FamilyManager", v: 1, data }); const ta = $("#expTxt"); ta.value = txt; ta.hidden = false; $("#expCopy").hidden = false; $("#expMsg").textContent = `${Math.round(txt.length / 1024)} KB pronti`; ta.focus(); ta.select(); };
  const ec = $("#expCopy"); if (ec) ec.onclick = async () => { const ta = $("#expTxt"); try { await navigator.clipboard.writeText(ta.value); $("#expMsg").textContent = "Copiati: ora incollali nella nuova copia."; } catch (e) { ta.focus(); ta.select(); try { document.execCommand("copy"); $("#expMsg").textContent = "Copiati: ora incollali nella nuova copia."; } catch (e2) { $("#expMsg").textContent = "Seleziona il testo e copialo a mano."; } } };
  const ig = $("#impGo"); if (ig) ig.onclick = () => {
    const msg = t => { $("#impMsg").textContent = t; };

    let obj; try { obj = JSON.parse($("#impTxt").value.trim()); } catch (e) { return msg("Il testo incollato non è valido: ricopialo per intero."); }
    if (!obj || obj.app !== "FamilyManager" || !obj.data) return msg("Questi non sono dati di FamilyManager.");

function bindInizia() {

  const add = $("#skAdd"); if (add) add.onclick = () => { syncSetup(); S.kids.push({ nome: "", eta: "" }); route(); setTimeout(() => { const f = document.getElementById(`su-k-nome-${S.kids.length - 1}`); if (f) f.focus(); }, 0); };
  document.querySelectorAll("[data-skrm]").forEach(b => b.onclick = () => { syncSetup(); S.kids.splice(+b.dataset.skrm, 1); if (!S.kids.length) S.figli = false; route(); });

/* ---------- router ---------- */
const BIND = { stanze: bindStanze, stanza: bindStanza, mappa: bindMappa, polizze: bindPolizze, garanzie: bindGaranzie, spese: bindSpese, mutuo: bindMutuo, investimenti: bindInvestimenti, pareggio: bindPareggio, domotica: bindAssistente, assistente: bindAssistente, guida: bindGuida, foto: bindFoto, membri: bindMembri, drive: bindDrive, viaggi: bindViaggi, cerca: bindCerca, documenti: bindDocumenti, scadenze: bindScadenze, accensioni: bindAccensioni, manutenzioni: bindManutenzioni, home: bindHome, area: bindHome, dati: bindTransfer, personalizza: bindImpostazioni, impostazioni: bindImpostazioni, calendario: bindCalendario, inizia: bindInizia, spesa: bindSpesa, dispensa: bindDispensa, salute: bindSalute, veicoli: bindVeicoli };
let lastRoute = "";
function route() {
  if (!location.hash || location.hash === "#" || location.hash === "#/") { location.replace(startHash()); return; }

  const id = V[parts[0]] ? parts[0] : "home";
  if (!can(id)) { $("#view").innerHTML = head("Sezione riservata", `Questa sezione è visibile solo ai genitori. Stai usando il profilo di ${esc(cur().nome)}.`) + `<a class="btn" href="#/home">Torna alla casa</a>`; }
  else { $("#view").innerHTML = V[id](parts[1]); document.querySelectorAll("#view [data-sec]").forEach(e => { if (!can(e.dataset.sec) || (e.dataset.sec === "mutuo" && MC.vuoto && id !== "mutuo")) e.remove(); }); if (BIND[id]) BIND[id](); bindForms(); bindRemove(); bindExtras(); }

  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; const h = startHash(); if (location.hash !== h) location.hash = h; else route(); });
  const sid = id === "stanza" ? "stanze" : id === "domotica" ? "assistente" : id;
